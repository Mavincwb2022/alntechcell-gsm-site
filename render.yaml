databases:
  - name: alntechcell-gsm-db
    databaseName: alntechcell_gsm_site
    plan: free

services:
  - type: web
    name: alntechcell-gsm-site
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: alntechcell-gsm-db
          property: connectionString
      - key: UNLOCKCLEAN_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: alntechunlocker@gmail.com
      - key: ADMIN_SETUP_TOKEN
        generateValue: true
      - key: PICPAY_CLIENT_ID
        sync: false
      - key: PICPAY_CLIENT_SECRET
        sync: false
      - key: PICPAY_WEBHOOK_TOKEN
        sync: false
      - key: PICPAY_SANDBOX
        value: "false"
      - key: PIX_CREDIT_RATE_BRL
        value: "1"
