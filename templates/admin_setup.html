<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020817"><title>Configuração do administrador | ALNTECHCELLPRO"><style>
:root{color-scheme:dark;--bg:#030817;--panel:#08172b;--line:#164d80;--muted:#9ab8d5;--text:#eef7ff;--cyan:#55dfff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:radial-gradient(ellipse at 50% -18%,#07366a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}.card{width:min(100%,520px);padding:26px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(150deg,#0a1c35,#071225);box-shadow:0 0 30px #008cff25}h1{font-size:1.4rem;color:var(--cyan);margin:0 0 7px}p{color:var(--muted);font-size:.87rem}label{display:block;margin:13px 0 5px;font-size:.82rem}input{width:100%;height:44px;border:1px solid #1c4c77;border-radius:8px;background:#030d1b;color:var(--text);padding:0 11px;font:inherit}button{width:100%;height:46px;margin-top:18px;border:1px solid #8aeaff;border-radius:9px;background:linear-gradient(110deg,#0874ed,#08c5ff);color:#00142a;font-weight:850;cursor:pointer}#message{min-height:20px;color:#ff9a9a;font-size:.82rem}
</style></head><body><main class="card"><h1>Configurar administrador</h1><p>Crie sua conta administrativa uma única vez. Defina sua senha nesta página; ela não será gravada no código nem enviada para o catálogo público.</p><form id="form"><label for="email">E-mail administrador</label><input id="email" type="email" value="{{ admin_email }}" readonly><label for="token">Token de configuração do Render</label><input id="token" type="password" autocomplete="off" required><label for="senha">Crie uma senha (mínimo 12 caracteres)</label><input id="senha" type="password" minlength="12" autocomplete="new-password" required><button type="submit">Criar minha conta administrativa</button></form><div id="message" role="status" aria-live="polite"></div></main><script>
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const m=document.getElementById('message');m.textContent='Configurando…';try{const r=await fetch('/api/auth/admin-setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,token:document.getElementById('token').value,senha:document.getElementById('senha').value})});const d=await r.json();if(!r.ok)throw Error(d.erro||'Não foi possível configurar.');location.href='/admin'}catch(err){m.textContent=err.message}});
</script></body></html>
