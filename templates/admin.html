<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020817"><title>Administração | ALNTECHCELLPRO"><style>
:root{color-scheme:dark;--bg:#030817;--panel:#08172b;--line:#164d80;--muted:#9ab8d5;--text:#eef7ff;--cyan:#55dfff}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -18%,#07366a 0,transparent 38%),var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,sans-serif}.bar{display:flex;justify-content:space-between;align-items:center;padding:16px max(18px,calc((100vw - 1200px)/2));border-bottom:1px solid var(--line);background:#040d1d}.brand{font-weight:900;letter-spacing:.08em;color:var(--cyan)}main{max-width:1200px;padding:24px 18px;margin:auto}h1{margin:0 0 18px}h2{font-size:1.05rem;color:var(--cyan);margin:0 0 12px}.panel{padding:18px;margin:16px 0;border:1px solid var(--line);border-radius:15px;background:linear-gradient(150deg,#0a1c35,#071225)}.sub{color:var(--muted);font-size:.82rem}table{width:100%;border-collapse:collapse;font-size:.8rem}th,td{text-align:left;border-bottom:1px solid #173c60;padding:9px 8px;vertical-align:top}th{color:#a8c9e4}button,a{border:1px solid #236394;border-radius:8px;background:#0b2847;color:#cde9ff;padding:7px 10px;font:inherit;text-decoration:none;cursor:pointer}.table-wrap{overflow:auto}.error{color:#ff9a9a}
</style></head><body><header class="bar"><div class="brand">ALNTECHCELLPRO · ADMIN</div><a href="/">Voltar ao site</a></header><main><h1>Painel administrativo</h1><p class="sub">Contas de clientes e pedidos separados por usuário.</p><section class="panel"><h2>Usuários cadastrados</h2><div class="table-wrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>WhatsApp</th><th>Tipo</th><th>Status</th></tr></thead><tbody id="users"></tbody></table></div></section><section class="panel"><h2>Pedidos recentes</h2><div class="table-wrap"><table><thead><tr><th>Nº</th><th>Cliente</th><th>WhatsApp</th><th>Serviço</th><th>Aparelho</th><th>Status</th><th>Data</th></tr></thead><tbody id="orders"></tbody></table></div></section><div id="message" class="sub" role="status" aria-live="polite"></div></main><script>
async function load(){const m=document.getElementById('message');try{const r=await fetch('/api/admin/resumo');const d=await r.json();if(!r.ok)throw Error(d.erro||'Sessão expirada.');for(const u of d.usuarios){const tr=document.createElement('tr');for(const v of [u.nome,u.email,u.whatsapp,u.papel,u.ativo?'Ativa':'Desativada']){const td=document.createElement('td');td.textContent=v;tr.append(td)}document.getElementById('users').append(tr)}for(const o of d.pedidos){const tr=document.createElement('tr');for(const v of [o.id,o.nome,o.whatsapp,o.servico,o.modelo,o.status,new Date(o.criado).toLocaleString('pt-BR')]){const td=document.createElement('td');td.textContent=v;tr.append(td)}document.getElementById('orders').append(tr)}}catch(e){m.textContent=e.message;m.className='error'}}load();
</script></body></html>
