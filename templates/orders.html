<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#082e83"><title>Meus pedidos | ALNTECHCELLPRO</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#172338;font:14px/1.45 Inter,system-ui,Segoe UI,sans-serif}.top{height:14px;background:#082e83}.page{max-width:1220px;margin:28px auto;padding:0 16px}.panel{background:#fff;border:1px solid #e1e6ed}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 24px;border-bottom:1px solid #e1e6ed}.head h1{font-size:1.1rem;margin:0 0 6px;text-transform:uppercase}.crumbs{font-size:.8rem;color:#728096}.crumbs a{color:#728096;text-decoration:none}.search{width:min(240px,100%);height:40px;border:1px solid #cbd4e1;border-radius:6px;padding:0 12px;color:#172338}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid #e5e9ef;font-size:.79rem;white-space:nowrap}th{font-size:.72rem;text-transform:uppercase;color:#344052;background:#fff}td.service{white-space:normal;min-width:280px}.badge{display:inline-flex;align-items:center;justify-content:center;min-width:130px;padding:5px 10px;border-radius:6px;color:#fff;font-weight:800}.badge.success{background:#2ca980}.badge.pending{background:#5a6c79}.badge.processing{background:#e58a00}.badge.error{background:#df272b}.badge.review{background:#5066a0}.empty{padding:30px;text-align:center;color:#718096}.foot{display:flex;justify-content:space-between;gap:12px;padding:14px 20px;color:#64748b;font-size:.8rem}.foot a{color:#082e83;text-decoration:none;font-weight:700}@media(max-width:620px){.page{margin:12px auto;padding:0 8px}.head{align-items:stretch;flex-direction:column;padding:16px}.search{width:100%}.foot{flex-direction:column}}
  </style>
</head>
<body><div class="top"></div><main class="page"><section class="panel"><header class="head"><div><h1>Histórico de pedidos (<span id="orderCount">0</span>)</h1><div class="crumbs"><a href="/">Início</a> › <a href="/#accountPanel">Painel</a> › Meus pedidos</div></div><input id="orderSearch" class="search" type="search" placeholder="Buscar"></header><div class="table-wrap"><table><thead><tr><th>Status</th><th>ID</th><th>Tipo</th><th>Qtd</th><th>Preço</th><th>Serviço</th></tr></thead><tbody id="orderRows"></tbody></table><div id="emptyOrders" class="empty" hidden>Você ainda não tem pedidos.</div></div><footer class="foot"><span>Pedidos vinculados à sua conta ALNTECHCELLPRO.</span><a href="/">Voltar ao painel</a></footer></section></main>
<script>
const rows=document.getElementById('orderRows'),search=document.getElementById('orderSearch');let orders=[];
function statusClass(status){const s=String(status||'').toLocaleLowerCase('pt-BR');if(s.includes('conclu')||s.includes('sucesso'))return 'success';if(s.includes('recus')||s.includes('rejeit'))return 'error';if(s.includes('andamento')||s.includes('process'))return 'processing';if(s.includes('análise')||s.includes('devolvido'))return 'review';return 'pending'}
function draw(){const q=search.value.trim().toLocaleLowerCase('pt-BR');rows.replaceChildren();const filtered=orders.filter(o=>[o.id,o.tipo,o.servico,o.status].join(' ').toLocaleLowerCase('pt-BR').includes(q));document.getElementById('orderCount').textContent=orders.length;document.getElementById('emptyOrders').hidden=filtered.length>0;if(!filtered.length&&orders.length)return;for(const o of filtered){const tr=document.createElement('tr');const st=document.createElement('td'),badge=document.createElement('span');badge.className='badge '+statusClass(o.status);badge.textContent=(statusClass(o.status)==='success'?'✓ ':statusClass(o.status)==='error'?'⊘ ':'')+o.status;st.append(badge);const id=document.createElement('td');id.textContent='#'+o.id;const type=document.createElement('td');type.textContent=o.tipo||'—';const qty=document.createElement('td');qty.textContent=o.quantidade||1;const price=document.createElement('td');price.textContent=new Intl.NumberFormat('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}).format((o.valor_centavos||0)/100)+' BRL';const service=document.createElement('td');service.className='service';service.textContent=o.servico;tr.append(st,id,type,qty,price,service);rows.append(tr)}}
search.addEventListener('input',draw);fetch('/api/minha-conta/pedidos').then(async r=>{const d=await r.json();if(r.status===401){location.href='/?entrar=1';return}if(!r.ok)throw Error(d.erro||'Não foi possível carregar seus pedidos.');orders=d.pedidos||[];draw()}).catch(e=>{document.getElementById('emptyOrders').hidden=false;document.getElementById('emptyOrders').textContent=e.message});
</script></body></html>
